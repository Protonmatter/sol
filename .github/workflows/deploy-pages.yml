name: Deploy web app (GitHub Pages)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify master CI artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
      manifest_sha256: ${{ steps.eligibility.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.eligibility.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Resolve run identity from GitHub and current master
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
          CANDIDATE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > metadata/run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$CANDIDATE_ATTEMPT/jobs?per_page=100" > metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha > metadata/master-sha.txt
          test "$(jq -r .head_sha metadata/run.json)" = "$EXPECTED_SHA"
          test "$(jq -r .repository.full_name metadata/run.json)" = "$GITHUB_REPOSITORY"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: candidate-evidence
      - name: Resolve exact candidate artifact ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(jq -er '.artifact_id | select(type == "number" and . > 0) | floor' candidate-evidence/release-evidence.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > metadata/artifact.json
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-candidate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: candidate-site
      - name: Validate static payload against the CI manifest
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN: ${{ github.event.workflow_run.id }}
          EXPECTED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          manifest_digest="$(jq -er .manifest_sha256 candidate-evidence/release-evidence.json)"
          python tools/validate_release_manifest.py candidate-site/web-release-manifest.json --expected-sha256 "$manifest_digest" --source-sha "$EXPECTED_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$EXPECTED_RUN" --run-attempt "$EXPECTED_ATTEMPT"
      - name: Require successful master artifact
        id: eligibility
        run: |
          set -euo pipefail
          python tools/release_policy.py --candidate candidate-evidence/release-evidence.json --run-metadata metadata/run.json --artifact-metadata metadata/artifact.json --jobs-metadata metadata/jobs.json --master-sha "$(cat metadata/master-sha.txt)" --require-rich-evidence --manifest candidate-site/web-release-manifest.json --publish-master
          echo "manifest_sha256=$(jq -er .manifest_sha256 candidate-evidence/release-evidence.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$(jq -er .artifact_id candidate-evidence/release-evidence.json)" >> "$GITHUB_OUTPUT"
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: candidate-site
          retention-days: 90

  deploy:
    name: Deploy immutable master artifact
    needs: verify
    if: needs.verify.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: candidate-evidence
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-candidate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: candidate-site
      - name: Recheck master artifact after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
          CANDIDATE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_MANIFEST: ${{ needs.verify.outputs.manifest_sha256 }}
          EXPECTED_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > metadata/run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$CANDIDATE_ATTEMPT/jobs?per_page=100" > metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" > metadata/artifact.json
          gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha > metadata/master-sha.txt
          test "$(jq -er .artifact_id candidate-evidence/release-evidence.json)" = "$EXPECTED_ARTIFACT_ID"
          test "$(jq -er .manifest_sha256 candidate-evidence/release-evidence.json)" = "$EXPECTED_MANIFEST"
          python tools/validate_release_manifest.py candidate-site/web-release-manifest.json --expected-sha256 "$EXPECTED_MANIFEST" --source-sha "$EXPECTED_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$CANDIDATE_RUN_ID" --run-attempt "$CANDIDATE_ATTEMPT"
          python tools/release_policy.py --candidate candidate-evidence/release-evidence.json --run-metadata metadata/run.json --artifact-metadata metadata/artifact.json --jobs-metadata metadata/jobs.json --master-sha "$(cat metadata/master-sha.txt)" --require-rich-evidence --manifest candidate-site/web-release-manifest.json --publish-master
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify served manifest and critical bytes independently
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tools/verify_served_release.py candidate-site/web-release-manifest.json --origin "$DEPLOYED_URL" > metadata/served-release-evidence.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: served-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: metadata/served-release-evidence.json
          if-no-files-found: warn
          retention-days: 90
