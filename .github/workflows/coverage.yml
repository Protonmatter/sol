name: Coverage

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust coverage (>= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.96.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.16 --locked
      - name: Workspace tests and line-coverage gate
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --all-features --locked \
            --fail-under-lines 90 --lcov --output-path coverage/rust.lcov
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: rust-coverage-${{ github.sha }}
          path: coverage/rust.lcov
          if-no-files-found: ignore
          retention-days: 14

  javascript:
    name: JavaScript coverage (>= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
      - name: Production-module line, branch, and function gates
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-lines=90 \
            --test-coverage-branches=90 \
            --test-coverage-functions=90 \
            tests/web/*.test.mjs

  python:
    name: Python coverage (>= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned coverage runner
        run: python -m pip install coverage==7.15.2
      - name: Provider, schema, and semantic contract tests
        shell: bash
        run: |
          coverage erase
          PYTHONPATH=tools coverage run --branch \
            --source=services/ephemeris-server,tools \
            -m unittest discover -s services/ephemeris-server -p 'test_*.py' -v
          PYTHONPATH=tools coverage run --branch --append \
            --source=services/ephemeris-server,tools \
            -m unittest discover -s tests/python -p 'test_*.py' -v
          coverage report \
            --include='services/ephemeris-server/server.py,tools/jsonschema_min.py,tools/validate_ephemeris_snapshot.py' \
            --fail-under=90 --show-missing
          mkdir -p coverage
          coverage xml -o coverage/python.xml \
            --include='services/ephemeris-server/server.py,tools/jsonschema_min.py,tools/validate_ephemeris_snapshot.py'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: python-coverage-${{ github.sha }}
          path: coverage/python.xml
          if-no-files-found: ignore
          retention-days: 14
