name: Ephemeris accuracy (JPL Horizons)

# Network-dependent: queries the live JPL Horizons API, so it is deliberately NOT part of the
# PR-gating CI (flaky / rate-limited). It runs weekly and on demand to catch ephemeris drift or an
# upstream Horizons change, and to re-confirm the "grounded in facts" accuracy claims.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  horizons:
    name: Validate + Moon syzygy stress vs JPL Horizons
    runs-on: ubuntu-latest
    # Network-dependent (live Horizons queries): cap the run so a hung/rate-limited API
    # can't tie up a runner indefinitely.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build the sky CLI
        id: build
        run: cargo build --release --locked -p solar-ephemeris --bin sky

      - name: Apparent alt/az vs Horizons (4-site envelope)
        id: reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qualification
          python tools/validate_ephemeris.py --report build/qualification/ephemeris-reference.json 2>&1 | tee build/qualification/ephemeris-reference.log

      - name: Moon apparent place at new/full moon (syzygy stress)
        id: syzygy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qualification
          python tools/stress_moon_syzygy.py 2>&1 | tee build/qualification/moon-syzygy.log

      - name: Retain source, run, binary and result identities
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          REFERENCE_RESULT: ${{ steps.reference.outcome }}
          SYZYGY_RESULT: ${{ steps.syzygy.outcome }}
        shell: python
        run: |
          import datetime, hashlib, json, os
          from pathlib import Path
          root = Path('build/qualification')
          root.mkdir(parents=True, exist_ok=True)
          binary = Path('target/release/sky')
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          evidence = {
              'schema_version': 'scientific-run-evidence.v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'recorded_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'outcomes': {key: os.environ[key] for key in ('BUILD_RESULT', 'REFERENCE_RESULT', 'SYZYGY_RESULT')},
              'binary_sha256': digest(binary) if binary.is_file() else None,
              'files': {path.name: digest(path) for path in sorted(root.iterdir()) if path.is_file()},
              'qualification_accepted': False,
              'limitations': ['Native CLI results; not browser-WASM qualification, raw reference archive, or maintainer acceptance.'],
          }
          (root / 'run.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: scientific-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qualification
          if-no-files-found: error
          retention-days: 90
