name: Daily data ingest

# Candidate only. Enabling the owned rolling PR adapter in a protected environment
# requires separate approval. Never push master or auto-merge.
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-research-feed-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: Generate and validate candidate; publication held
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Acquire, stage, validate and select local bundle
        run: python tools/run_daily_ingest.py --fail-on-degraded
      - name: Record validated candidate and explicit approval hold
        run: python tools/delivery_lifecycle.py --pointer apps/web/data/current.json --out build/feed-candidate-lifecycle.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: daily-feed-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/data/current.json
            apps/web/data/bundles
            apps/web/data/attempts
            .cache/solar-data/current.json
            .cache/solar-data/bundles
            .cache/solar-data/attempts
            build/feed-candidate-lifecycle.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
