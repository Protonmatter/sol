name: Publish solar-ephemeris to crates.io

# Registry publication is deliberately held. A schedule may no longer turn a
# version bump or registry outage into publication authority.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source SHA for package qualification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-solar-ephemeris
  cancel-in-progress: false

jobs:
  package:
    name: Qualify exact source package (publication held)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate exact requested source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Test and package exact source without registry credentials
        run: |
          set -euo pipefail
          mkdir -p build/crate-evidence
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          cargo test -p solar-ephemeris --locked
          cargo package --list -p solar-ephemeris --locked > build/crate-evidence/package-list.txt
          cargo publish --dry-run -p solar-ephemeris --locked 2>&1 | tee build/crate-evidence/dry-run.txt
          candidates=(target/package/solar-ephemeris-*.crate)
          test "${#candidates[@]}" = 1
          python tools/release_crate.py --package "${candidates[0]}" --source-sha "${{ inputs.source_sha }}" --dry-run-log build/crate-evidence/dry-run.txt --dry-run-exit 0 > build/crate-evidence/package-evidence.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qualified-crate-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/package/*.crate
            build/crate-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Explicit publication authority boundary
        run: |
          echo '::error::Publication held: exact-source CI, accepted package digest/contents/notices and separate protected registry authority are required. No registry credential was loaded.'
          exit 1
