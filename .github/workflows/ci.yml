name: CI

on:
  push:
    branches: [master, "precision/**", "redesign/**"]
  pull_request:
  # Dispatch remains diagnostic only; it cannot replace an approved PR check run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    name: Candidate identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

  governance:
    name: Governance and specification contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Requirements, RFCs, evidence, dependencies, and release workflow contracts
        run: python tools/validate_sdlc.py
      - name: Documentation links, badges, and style
        run: python tools/validate_docs.py
      - name: Progressive disclosure and accessibility structure
        run: python tools/validate_ux_contract.py
      - name: Scientific visual asset identity and allowed-use inventory
        run: python tools/validate_visual_assets.py
      - name: Governance and UX validator regression tests
        run: >-
          PYTHONPATH=tools python -m unittest
          tests.python.test_sdlc_contract tests.python.test_ux_contract -v

  test:
    name: Rust tests (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  artifact:
    name: Build immutable web artifact
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: web-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build and stage final bytes once
        run: |
          python tools/build_wasm.py --locked --out-root build/wasm
          python tools/release_evidence.py --capture-build > build/build-provenance.json
          python tools/build_web.py --wasm-dir build/wasm --out-root build/site --release-id "ci-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --base-path /sol/
          python tools/validate_release_manifest.py build/site/web-release-manifest.json --source-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Record final manifest digest
        id: manifest
        run: python -c "import hashlib,os; from pathlib import Path; value=hashlib.sha256(Path('build/site/web-release-manifest.json').read_bytes()).hexdigest(); Path(os.environ['GITHUB_OUTPUT']).open('a').write('sha256='+value+'\n')"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: build-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/build-provenance.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        id: upload
        with:
          name: web-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/site
          if-no-files-found: error
          retention-days: 90

  # Preserve the protected check name while verifying the same bytes built above.
  wasm:
    name: WASM build (wasm32-unknown-unknown)
    needs: artifact
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_RESULT: ${{ needs.artifact.result }}
      ARTIFACT_ID: ${{ needs.artifact.outputs.artifact_id }}
      MANIFEST_SHA256: ${{ needs.artifact.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Require successful same-run artifact build
        shell: python
        run: |
          import os
          if os.environ["ARTIFACT_RESULT"] != "success" or not os.environ["ARTIFACT_ID"] or not os.environ["MANIFEST_SHA256"]:
              raise SystemExit("WASM verification requires a successful artifact build and its immutable identity")
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/site
      - name: Verify both WASM binaries and exact candidate identity
        run: python tools/validate_release_manifest.py build/site/web-release-manifest.json --expected-sha256 "$MANIFEST_SHA256" --source-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

  web:
    name: Web, provider, and browser validation
    runs-on: ubuntu-latest
    timeout-minutes: 40  # smoke's worst case is 6 browser launches x 180 s = 18 min before wasm build + browser_validation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: wasm32-unknown-unknown

      - name: Install locked browser-validation tooling
        run: npm ci --ignore-scripts

      - name: JavaScript syntax (native ESM)
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file"; then
              echo "::error file=$file::JavaScript syntax error"
              status=1
            fi
          done < <(find apps/web tools \( -name '*.js' -o -name '*.mjs' \) -print0)
          exit $status

      - name: JS unit tests (node --test)
        # Explicit file list (shell glob): this runner rejects a bare directory argument.
        shell: bash
        run: npm test

      # The ?v= specifiers are stripped in a temp copy — see tools/typecheck_web.py.
      # This is blocking: a broken project-file handoff previously made the advisory
      # check fail before it ever inspected application types.
      - name: JSDoc typecheck (tsc)
        run: python tools/typecheck_web.py

      - name: Python syntax
        run: python -m compileall -q tools services/ephemeris-server

      - name: Python tool imports resolve (offline)
        # compileall only checks syntax; it does not execute imports. This catches
        # cross-module drift (e.g. a renamed helper) before it reaches the scheduled,
        # non-PR-gated ephemeris-accuracy workflow. Network lives in each script's
        # main(), so importing the modules is offline and safe.
        run: PYTHONPATH=tools python -c "import validate_ephemeris, stress_moon_syzygy"

      - name: Star catalogue regen-stable + physics spot-checks
        # Regenerates starcatalog.js + stars.rs from the committed pristine sources and
        # requires byte-identity with what's committed, then spot-checks derived physics
        # (Sirius/Vega/… distances, temperatures, luminosities) against literature values.
        run: python tools/validate_star_catalog.py

      - name: Surface geography regen-stable
        # Regenerates apps/web/js/geography.js from the committed pristine sources
        # (tools/ephemeris-data/geography/) and requires byte-identity with what's committed,
        # so the shipped coastlines and lunar maria always match their provenance. Offline —
        # tools/fetch_geography.py is the only networked step and is never run here.
        run: python tools/generate_geography.py --check

      - name: Body constants pinned to sources (WGCCRE 2015 / fact sheets) + GLSL hygiene
        # docs/ACCURACY_CONTRACT.md enforcement: every pole/W/spin/radius/mass/ring number in
        # bodyData.js must match its pinned source edition; rotationHours must agree with the
        # Ẇ actually rendered; Mars's deliberate IAU-2009 exception keeps its warning comment;
        # literal smoothstep edges must be increasing (reversed edges are undefined GLSL).
        run: python tools/validate_body_constants.py

      - name: Motion contract (measured rotation, spin sense, obliquity, moon periods, time cap)
        # The dynamic companion to the constants gate: it advances the simulation clock through
        # the renderer's own rotationPhase()/poleVector() and measures. Every body's sidereal
        # period must match the card, Venus and Uranus must be the only retrograde rotators,
        # every axis must lean by what the fact sheets allow, all 21 moon periods must fall out
        # of the shipped element knots, and the visible-spin cap must engage exactly at its
        # threshold on every shipped speed preset — a correct constant consumed by broken code
        # passes validate_body_constants.py and fails here.
        run: python tools/validate_body_motion.py

      - name: Moon orbits regen-stable + validated vs JPL Horizons
        # Regenerates apps/web/js/moons.js from the committed Horizons elements and requires
        # byte-identity, then interpolates every moon and compares against committed Horizons
        # state vectors at times interleaved between the element knots. Offline —
        # tools/fetch_moons.py is the only networked step and is never run here.
        run: python tools/validate_moons.py

      - name: EOP prediction coverage
        run: python tools/check_eop_freshness.py --minimum-days 90

      - name: Solar snapshot contract (v2)
        run: python tools/validate_snapshot.py apps/web/data/latest-state.json

      - name: Operational-readiness gate
        run: python tools/validate_operational_readiness.py apps/web/data/latest-state.json

      # ADR 0005 round-trip: the Rust CLI reads a real observation report, corrects the
      # activity forecast through the Kalman primitive, and the emitted Assimilation-mode
      # snapshot must pass the shared Python validators — Rust reading, Rust writing,
      # Python judging, one contract.
      - name: Assimilation round-trip (Rust -> shared validators)
        shell: bash
        run: |
          cargo run --quiet --locked -p solar-cli -- simulate --steps 48 --dt-hours 1 --seed 42 \
            --observations apps/web/data/latest-observations.json --out /tmp/assimilated.json
          grep -q '"mode": "Assimilation"' /tmp/assimilated.json
          python tools/validate_snapshot.py /tmp/assimilated.json
          python tools/validate_operational_readiness.py /tmp/assimilated.json

      - name: Regenerate deterministic solar-cycle series
        run: python tools/generate_series.py

      - name: Series frames validate (solar-state-snapshot.v2)
        shell: bash
        run: |
          status=0
          for file in apps/web/data/series/frame-*.json; do
            python tools/validate_snapshot.py "$file" || status=1
          done
          exit $status

      - name: Series regeneration is byte-stable AND matches the committed frames
        shell: bash
        run: |
          cp -a apps/web/data/series /tmp/series-a
          python tools/generate_series.py
          diff -qr /tmp/series-a apps/web/data/series
          # Regen-vs-regen alone let committed frames drift from the generator for two
          # PRs (the audit's determinism blind spot #16) — also require regen == committed.
          if ! git diff --exit-code --stat -- apps/web/data/series; then
            echo "::error::committed series frames drifted from generate_series.py — regenerate and commit"
            exit 1
          fi

      - name: Deterministic solar fixture regeneration
        shell: bash
        run: |
          python tools/generate_fixture_snapshot.py --out /tmp/det-a.json --observations-out tests/fixtures/live-swpc-normalized.json
          python tools/generate_fixture_snapshot.py --out /tmp/det-b.json --observations-out /tmp/det-b-obs.json
          cmp /tmp/det-a.json /tmp/det-b.json
          python tools/validate_snapshot.py /tmp/det-a.json
          if ! git diff --quiet -- tests/fixtures/live-swpc-normalized.json; then
            echo "::error::fixture generator drifted from the committed observation fixture"
            git --no-pager diff --stat -- tests/fixtures/live-swpc-normalized.json
            exit 1
          fi

      - name: Generate on-device ephemeris v3 fixture
        run: cargo run --quiet --locked -p solar-ephemeris --example snapshot > /tmp/ephemeris-v3.json

      - name: Ephemeris v3 structural schema
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import jsonschema_min
          data = json.loads(Path("/tmp/ephemeris-v3.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("docs/ephemeris-snapshot-v3.schema.json").read_text(encoding="utf-8"))
          errors = jsonschema_min.validate(data, schema)
          if errors:
              print("\n".join(f"ERROR: {error}" for error in errors), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Ephemeris v3 finite-number safety
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import validate_ephemeris_snapshot as validator
          data = json.loads(Path("/tmp/ephemeris-v3.json").read_text(encoding="utf-8"))
          errors = validator.finite_tree(data)
          if errors:
              print("\n".join(f"ERROR: {error}" for error in errors), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Ephemeris v3 time and EOP semantics
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import validate_ephemeris_snapshot as validator
          data = json.loads(Path("/tmp/ephemeris-v3.json").read_text(encoding="utf-8"))
          time = data.get("time") or {}
          observer = data.get("observer") or {}
          accuracy = data.get("accuracy") or {}
          errors = validator.check_time(time)
          for key in (
              "terrestrial_lat_deg", "terrestrial_lon_deg_east",
              "polar_motion_corrected_lat_deg", "polar_motion_corrected_lon_deg_east", "elev_m",
          ):
              if key in observer and not validator.finite(observer[key]):
                  errors.append(f"observer.{key} must be finite")
          eop = time.get("earth_orientation") or {}
          if accuracy.get("eop_status") != eop.get("quality"):
              errors.append("accuracy.eop_status must equal time.earth_orientation.quality")
          if eop.get("quality") == "degraded":
              if "degraded" not in str(accuracy.get("class", "")).lower():
                  errors.append("degraded EOP requires a degraded accuracy class")
              if not any("degraded" in str(item).lower() for item in data.get("warnings", [])):
                  errors.append("degraded EOP requires an explicit warning")
          if errors:
              print("\n".join(f"ERROR: {error}" for error in errors), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Ephemeris v3 body and event semantics
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import validate_ephemeris_snapshot as validator
          data = json.loads(Path("/tmp/ephemeris-v3.json").read_text(encoding="utf-8"))
          errors = validator.semantic_checks(data)
          if errors:
              print("\n".join(f"ERROR: {error}" for error in errors), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Validate complete ephemeris v3 contract
        run: python tools/validate_ephemeris_snapshot.py /tmp/ephemeris-v3.json

      - name: Validate browser ephemeris v3 runtime guard
        run: node tools/test_ephemeris_contract.mjs /tmp/ephemeris-v3.json

      - name: Validate optional DE441 provider contract offline
        run: python services/ephemeris-server/test_server.py -v

      - name: Python schema and ephemeris semantic regression tests
        run: PYTHONPATH=tools python -m unittest discover -s tests/python -p 'test_*.py' -v

      - name: Static source validation
        run: python tools/validate_web_static.py

  coverage:
    name: Coverage
    needs: artifact
    uses: ./.github/workflows/coverage.yml
    with:
      artifact_name: ${{ needs.artifact.outputs.artifact_name }}
      manifest_sha256: ${{ needs.artifact.outputs.manifest_sha256 }}

  docs:
    name: Docs
    uses: ./.github/workflows/docs.yml

  release-gate:
    name: Release gate
    if: always()
    needs: [candidate, governance, test, lint, web, artifact, wasm, coverage, docs, determinism, determinism-compare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/site
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: build-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: '*-coverage-${{ github.sha }}'
          path: build/coverage-evidence
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: javascript-coverage-and-visuals-${{ github.sha }}
          path: build/coverage-evidence/javascript
      - name: Evaluate every same-run dependency and retain promotion hold
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ARTIFACT_ID: ${{ needs.artifact.outputs.artifact_id }}
          MANIFEST_SHA256: ${{ needs.artifact.outputs.manifest_sha256 }}
        run: python tools/release_policy.py --ci-evidence build/release-evidence.json --manifest build/site/web-release-manifest.json --coverage-root build/coverage-evidence --build-provenance build/build-provenance.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-evidence.json
          if-no-files-found: error
          retention-days: 90

  # The engine's determinism and the wasm "byte-compatible snapshots" claim both rest on
  # every float passing through platform libm before {:.6} rounding — plausible, never
  # proven. These two jobs make it an enforced property: the same reference simulation
  # must be byte-identical run-to-run on each OS AND byte-identical across all three.
  # If a platform ever diverges, this reddens and the accuracy docs gain a caveat —
  # either way the claim stops being prose.
  determinism:
    name: Engine determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Reference simulation, twice — byte-identical on this OS
        shell: bash
        run: |
          cargo run --release --locked -p solar-cli -- simulate --steps 48 --dt-hours 1 --seed 42 --activity 0.9 --out "snapshot-${{ matrix.os }}.json"
          cargo run --release --locked -p solar-cli -- simulate --steps 48 --dt-hours 1 --seed 42 --activity 0.9 --out snapshot-again.json
          cmp "snapshot-${{ matrix.os }}.json" snapshot-again.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: determinism-${{ matrix.os }}
          path: snapshot-${{ matrix.os }}.json

  determinism-compare:
    name: Engine determinism (cross-OS byte compare + schema)
    runs-on: ubuntu-latest
    needs: determinism
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: snaps
          pattern: determinism-*
          merge-multiple: true
      - name: Snapshots byte-identical across ubuntu / macos / windows
        shell: bash
        run: |
          ls -l snaps
          cmp snaps/snapshot-ubuntu-latest.json snaps/snapshot-macos-latest.json
          cmp snaps/snapshot-ubuntu-latest.json snaps/snapshot-windows-latest.json
      # Also the first time a RUST-emitted snapshot passes the shared JSON Schema in CI —
      # the "enforced across Rust, Python, and the browser" claim previously leaned on a
      # substring smoke test on the Rust side.
      - name: Rust CLI output passes the shared snapshot contract
        run: python tools/validate_snapshot.py snaps/snapshot-ubuntu-latest.json
