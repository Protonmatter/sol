name: Docs

# Keeps documentation and the development contract honest against the tree. Offline and
# deterministic: Markdown links/badges/style plus requirements, RFCs, evidence paths,
# dependency automation, immutable action pins, coverage thresholds, and release semantics.

on:
  push:
    branches: [master, "precision/**", "redesign/**"]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown links, badges + style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate Markdown (offline links, badges + style lint)
        run: python tools/validate_docs.py
      - name: Validate requirements, RFCs, evidence, and workflow contracts
        run: python tools/validate_sdlc.py
