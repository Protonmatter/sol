name: Docs

# Keeps documentation and the development contract honest against the tree. Offline and
# deterministic: Markdown links/badges/style plus requirements, RFCs, evidence paths,
# dependency automation, immutable action pins, coverage thresholds, and release semantics.

on:
  push:
    branches: [master, "precision/**", "redesign/**"]
  pull_request:
    # The daily-ingest branches are excluded on purpose. Their PRs are opened by
    # github-actions[bot], which GitHub's approval policy treats as a perpetual
    # first-time contributor: the pull_request runs fire, land in action_required,
    # and wait for a human — while the ingest workflow has ALREADY dispatched these
    # same checks at the branch SHA to satisfy the required contexts and auto-merge.
    # The held runs gate nothing; they only accumulate as approval requests.
    branches-ignore: ["data/daily-ingest-**"]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown links, badges + style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate Markdown (offline links, badges + style lint)
        run: python tools/validate_docs.py
      - name: Validate requirements, RFCs, evidence, and workflow contracts
        run: python tools/validate_sdlc.py
