[workspace]
members = [
  "crates/solar-core",
  "crates/solar-ingest",
  "crates/solar-cli",
  "crates/solar-wasm",
  "crates/solar-ephemeris"
]
# The fuzz harness lives OUTSIDE the workspace on purpose: libfuzzer-sys is the one
# accepted external dependency, and excluding it keeps this workspace's Cargo.lock
# zero-third-party and auditable. See .github/workflows/fuzz.yml.
exclude = ["crates/solar-ephemeris/fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Protonmatter/sol"
# Publish floor, not a promise of the oldest possible: verified by CI stable; add an MSRV
# job (and lower this deliberately) before the first crates.io release if older matters.
rust-version = "1.85"

# Keep compact native release builds; tests and native consumers use the default
# unwind strategy. Browser-specific abort and speed settings live below.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Browser builds keep the release size/LTO settings but never unwind across the
# raw WASM ABI. A separate profile avoids native test abort/unwind collisions.
[profile.wasm-release]
inherits = "release"
panic = "abort"

# Full-precision ephemeris evaluation is a measured per-frame hot path. This
# speed optimization is WASM-only; no fast-math flags or accuracy changes.
[profile.wasm-release.package.solar-ephemeris]
opt-level = 3
